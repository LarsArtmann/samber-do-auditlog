name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly Monday 05:00 UTC sweep: catches new advisories and rot between pushes.
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: go-version drift guard
        run: ./scripts/check-go-version.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test -race with coverage
        run: |
          go test -race -count=1 -coverprofile=cover.out -covermode=atomic ./...
          # Exclusions are single-sourced in scripts/coverage-exclusions.txt
          # (shared with scripts/coverage-gate.sh): demo (example/) and
          # tooling (cmd/).
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            set -- "$@" -e "$line"
          done < scripts/coverage-exclusions.txt
          grep -v "$@" cover.out > cover-filtered.out
          coverage=$(go tool cover -func=cover-filtered.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${coverage}%"
          if awk "BEGIN {exit !($coverage < 94.0)}"; then
            echo "::error::Coverage ${coverage}% is below 94%"
            exit 1
          fi
      - name: Publish coverage step summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```'
            go tool cover -func=cover-filtered.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - name: Cache golangci-lint binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.1.6-${{ runner.os }}
      - name: Install golangci-lint (skipped on cache hit)
        # Pinned to the newest v2 release whose go directive (1.23.0) is
        # satisfiable by the setup-go toolchain above — runners force
        # GOTOOLCHAIN=local, so `go install` refuses anything newer.
        run: command -v golangci-lint >/dev/null 2>&1 || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Verify golangci-lint config
        run: golangci-lint config verify
      - name: golangci-lint
        run: golangci-lint run --timeout=10m

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
      - name: govulncheck
        # Pinned to the newest release whose go directive (1.22.0) is
        # satisfiable by the go1.23 toolchain above. Bump deliberately.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  mod-tidy:
    name: go mod tidy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true
      - name: go mod tidy (transport-flake tolerant)
        # 2026-09-01: 2 of 3 CI runs died on transient proxy.golang.org
        # transport errors. Retry downloads only — the drift check below stays
        # strict and never retries.
        run: |
          for attempt in 1 2 3; do
            if go mod tidy; then
              exit 0
            fi
            echo "attempt $attempt failed (often a proxy.golang.org transport flake); retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::go.sum is out of sync with go.mod. Run 'go mod tidy' and commit the result."
            git diff --stat
            exit 1
          fi

  stale-generation:
    name: Stale generated code check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true
      - name: Generated files must be committed
        # v0.9.0 was retracted because a gitignored generated file was missing
        # from the tag. Assert presence BEFORE go generate, which would
        # otherwise silently recreate it and mask the regression.
        run: |
          for f in schema/report.schema.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the repo — generated files must be committed (v0.9.0 retraction class)"
              exit 1
            fi
          done
      - name: go generate (transport-flake tolerant)
        run: |
          for attempt in 1 2 3; do
            if go generate ./...; then
              exit 0
            fi
            echo "attempt $attempt failed (often a proxy.golang.org transport flake); retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Check for drift in generated files
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is stale. Run 'go generate ./...' and commit the result."
            git diff --stat
            exit 1
          fi

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: actionlint -color

  example-smoke:
    name: Example smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          cache: true
      - name: Run example self-check (23-feature integration check)
        env:
          DO_AUDITLOG_ENABLED: "true"
        run: go run ./example
