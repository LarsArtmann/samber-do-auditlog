# samber-do-auditlog is a library whose PUBLIC API is the root package
# (github.com/larsartmann/samber-do-auditlog) — consumers import it directly,
# so moving root .go files into internal/ would break the import path.
# The "flat" exclusion preset disables the standard-layout rules that do not
# apply to this project shape (root-package-files, root-main-go,
# cmd-directory, internal-directory, docs-directory). Precedent:
# go-datastar ADR-002.
presets: [flat]

# Verified 2026-09-22: 37 root-package-files errors drop to 0 warnings under gsl v0.11.0+.
