    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Virtual camera (viewport-change): ONE cam object, ONE writer.
      // Open tight (~1.5x) on the waveform strip; target = world (960, 157),
      // offset from center (960, 540) = (0, -383); T = -offset x S = (0, 574.5).
      const world = document.getElementById("f04r-world");
      const cam = { scale: 1.5, x: 0, y: 574.5 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera(); // seed frame 0 — punched-in on the waveform strip

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0-1.4s): tight on the strip; gentle outward creep (<15% travel).
      tl.fromTo(
        cam,
        { scale: 1.5, x: 0, y: 574.5 },
        { scale: 1.44, y: 551.5, duration: 1.4, ease: "sine.inOut", onUpdate: applyCamera },
        0
      );

      // Scene 2 (1.4-3.9s): THE signature move — one continuous decelerating
      // zoom-out reveals the containing report; the strip drifts to its home slot.
      tl.to(
        cam,
        { scale: 1, x: 0, y: 0, duration: 2.5, ease: "power3.inOut", onUpdate: applyCamera },
        1.4
      );
      // Scene 3 (4.0-5.0s): locked at 1.0x — stillness. No camera tweens after the lock.

      // Bounded luminance pulse on the waveform strip (sine-wave-loop, onUpdate form):
      // phase 0 -> 4pi, settle-and-fade tail so the locked frame ends clean.
      const pulse = document.getElementById("f04r-pulse");
      const glow = document.getElementById("f04r-glow");
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 4,
          duration: 3.3,
          ease: "none", // sine is the curve
          onUpdate: () => {
            const s = Math.sin(phase.p);
            const q = phase.p / (Math.PI * 4);
            const env = q < 0.8 ? 1 : Math.max(0, (1 - q) / 0.2);
            pulse.style.opacity = String((0.42 + s * 0.3) * env);
            glow.style.opacity = String(0.72 + Math.sin(phase.p + Math.PI / 2) * 0.18 * env);
          },
        },
        0.05
      );

      window.__timelines["04-report"] = tl;
    </script>
