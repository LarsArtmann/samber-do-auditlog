<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1C1915;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-black-box"
        class="scene"
        data-composition-id="01-black-box"
        data-composition-src="compositions/frames/01-black-box.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-see-everything"
        class="scene"
        data-composition-id="02-see-everything"
        data-composition-src="compositions/frames/02-see-everything.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-terminal"
        class="scene"
        data-composition-id="03-terminal"
        data-composition-src="compositions/frames/03-terminal.html"
        data-start="9"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-04-report"
        class="scene"
        data-composition-id="04-report"
        data-composition-src="compositions/frames/04-report.html"
        data-start="16"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-install"
        class="scene"
        data-composition-id="05-install"
        data-composition-src="compositions/frames/05-install.html"
        data-start="21"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
