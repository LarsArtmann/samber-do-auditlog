version: "2"
run:
    timeout: 5m
    go: "1.23"
    build-tags:
        - goexperiment.runtimesecret
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    enable:
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - err113
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godot
        - godox
        - goheader
        - gomoddirectives
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - ireturn
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unused
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - zerologlint
    settings:
        cyclop:
            max-complexity: 12
        depguard:
            rules:
                cmd:
                    allow:
                        - $gostd
                        - github.com/invopop/jsonschema
                        - github.com/larsartmann/samber-do-auditlog
                    files:
                        - '**/cmd/**'
                example:
                    allow:
                        - $gostd
                        - github.com/a-h/templ
                        - github.com/larsartmann/go-output
                        - github.com/larsartmann/samber-do-auditlog
                        - github.com/samber
                    files:
                        - '**/example/**'
                main:
                    allow:
                        - $gostd
                        - github.com/a-h/templ
                        - github.com/larsartmann/go-atomic-write
                        - github.com/larsartmann/go-error-family
                        - github.com/larsartmann/go-ndjson
                        - github.com/larsartmann/go-output
                        - github.com/larsartmann/go-sse
                        - github.com/larsartmann/samber-do-auditlog
                        - github.com/samber
                    files:
                        - '!**/*_test.go'
                        - '!**/example/**'
                        - '!**/cmd/**'
                tests:
                    allow:
                        - $gostd
                        - github.com/a-h/templ
                        - github.com/larsartmann/go-error-family
                        - github.com/larsartmann/go-output
                        - github.com/larsartmann/go-sse
                        - github.com/larsartmann/samber-do-auditlog
                        - github.com/samber
                    files:
                        - '**/*_test.go'
        errcheck:
            exclude-functions:
                - (*os.File).Close
                - (io.Closer).Close
                - (*sql.DB).Close
                - (*sql.Rows).Close
                - (*sql.Stmt).Close
                - (net.Conn).Close
                - (*net.TCPConn).Close
                - (*net.UDPConn).Close
                - fmt.Fprint
                - fmt.Fprintf
                - fmt.Fprintln
                - fmt.Print
                - fmt.Printf
                - fmt.Println
                - (*strings.Builder).WriteString
                - (*bytes.Buffer).WriteString
        exhaustruct:
            exclude:
                - os/exec.Cmd
                - do.InjectorOpts
                - sync.RWMutex
                - sync.Mutex
                - atomic.Int64
                - github.com/larsartmann/samber-do-auditlog/live.sseEvent
                - github.com/larsartmann/samber-do-auditlog/live.Hub
                - github.com/larsartmann/samber-do-auditlog/live.Server
                - github.com/larsartmann/samber-do-auditlog/live.healthResponse
                - github.com/larsartmann/samber-do-auditlog/health.Response
                - github.com/larsartmann/samber-do-auditlog/health.Check
                - github.com/larsartmann/samber-do-auditlog/health.Routes
                - github.com/larsartmann/samber-do-auditlog/health.Probe
                - github.com/larsartmann/samber-do-auditlog.NDJSONStreamer
                - github.com/larsartmann/samber-do-auditlog.Config
                - github.com/larsartmann/samber-do-auditlog.live.Config
                - github.com/larsartmann/samber-do-auditlog.MultiWriter
                - github.com/larsartmann/samber-do-auditlog.live.eventRingBuffer
        funlen:
            lines: 200
            statements: 100
        ginkgolinter:
            forbid-focus-container: true
            forbid-spec-pollution: true
        gocritic:
            disabled-checks:
                - ifElseChain
        gomoddirectives:
            replace-local: true
        gosec:
            excludes:
                - G304
                - G115
        ireturn:
            allow:
                - error
                - empty
                - anon
                - stdlib
                - generic
        makezero:
            always: true
        mnd:
            ignored-numbers:
                - "0"
                - "1"
                - "2"
                - "100"
        revive:
            rules:
                - disabled: true
                  name: exported
                - disabled: true
                  name: package-comments
        tagliatelle:
            case:
                rules:
                    json: snake
        testifylint:
            disable:
                - go-require
            enable-all: true
        varnamelen:
            ignore-map-index-ok: true
            ignore-names:
                - err
                - ok
                - w
                - r
                - tt
                - fn
                - t
                - i
                - m
                - g
                - a
                - b
                - v
            ignore-type-assert-ok: true
        wrapcheck:
            ignore-package-globs:
                - github.com/larsartmann/samber-do-auditlog
                - github.com/larsartmann/go-sse
    exclusions:
        generated: lax
        rules:
            - path: _test\.go
              linters:
                - exhaustruct
                - testpackage
                - gochecknoglobals
                - funlen
                - cyclop
                - goconst
                - staticcheck
            - path: _test\.go
              text: unused
              linters:
                - unused
            - path: example/
              linters:
                - forbidigo
                - funlen
                - mnd
                - unparam
                - varnamelen
                - noinlineerr
            - path: live/demo/
              linters:
                - forbidigo
                - funlen
                - mnd
                - unparam
                - varnamelen
                - noinlineerr
                - exhaustruct
                - errcheck
                - err113
                - nlreturn
                - goconst
            - path: cmd/
              linters:
                - forbidigo
                - funlen
                - mnd
                - unparam
                - varnamelen
                - noinlineerr
                - exhaustruct
                - gosec
                - err113
                - errcheck
                - wrapcheck
                - nlreturn
                - goconst
            - path: _test\.go
              linters:
                - paralleltest
                - noinlineerr
                - gosec
                - varnamelen
        paths:
            - \.gen\.go$
            - vendor/
formatters:
    enable:
        - gci
        - goimports
        - gofumpt
        - golines
    settings:
        golines:
            max-len: 120
issues:
    max-issues-per-linter: 50
    max-same-issues: 10
