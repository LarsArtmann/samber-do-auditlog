# BuildFlow Configuration for samber-do-auditlog
#
# go-auto-upgrade is SKIPPED: its jsonv1tov2 migrator is incompatible with
# this project's encoding/json/v2 exclusion policy (see AGENTS.md). The
# migrator naively rewrites encoding/json to encoding/json/v2 +
# encoding/json/jsontext, breaking API calls (e.g. enc.SetIndent has no
# jsontext.Encoder equivalent). Re-enable when Go 1.27 stabilizes json/v2.

build_mode: full

# Fuzz tests need ~30s each x 5 targets; the default is too short.
# (formerly `max_time: 5m`, a key BuildFlow never read)
default_step_timeout: 5m

# Required by transitive deps (go-output, go-branded-id, go-ndjson).
env:
  GOEXPERIMENT: jsonv2

skip_steps:
  - go-auto-upgrade
