# BuildFlow Configuration for samber-do-auditlog — non-default settings only.
#
# go-auto-upgrade runs unskipped since 2026-09-22 (gau v0.6.3 fixed the
# codec-struct-field half-rewrite; the go-version/dependency/
# unclaimed-constructor gates make the json/v2 swap fail-safe).

# Fuzz tests need ~30s each x 5 targets; the default is too short.
# (formerly `max_time: 5m`, a key BuildFlow never read)
default_step_timeout: 5m

# encoding/json/v2 usage (direct + via go-output, go-branded-id, go-ndjson)
# is auto-detected by BuildFlow, which sets GOEXPERIMENT for tool subprocesses.
