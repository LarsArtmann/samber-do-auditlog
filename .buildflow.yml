# BuildFlow Configuration for samber-do-auditlog
# ================================================
#
# go-auto-upgrade is SKIPPED as belt-and-braces: its jsonv1tov2 migrator
# rewrites encoding/json to encoding/json/v2, which this Go 1.23 branch
# forbids (json/v2 needs Go 1.25+). This branch has no json/v2 dependencies,
# so the migrator would not trigger anyway — keep the skip until master's
# policy is ported back, if ever.

build_mode: full

parallel: true
max_concurrency: 4

# Fuzz tests need ~30s each x 5 targets; default 2m is too short.
max_time: 5m

max_file_size: 350
dupl_threshold: 30

todo_min_severity: info

skip_steps:
  - go-auto-upgrade


auto_fix: false

verbose: false
log_level: info
